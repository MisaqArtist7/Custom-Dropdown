<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Dropdown</title>

    <link rel="stylesheet" href="assets/style/output.css">
    
    <style>
        /* Animated dark gradient background to enhance the glassmorphism effect */
        body {
            background: linear-gradient(135deg, #0f172a 0%, #3b0764 50%, #1e1b4b 100%);
            background-size: 200% 200%;
            animation: gradientMove 10s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
    
</head>
<body class="min-h-screen antialiased text-white">
    <main class="flex justify-center items-center min-h-screen px-4">
        <section class="w-full max-w-xs relative">
            
            <div class="cd-dropdown relative font-sans">
                
                <!-- Glassmorphism Dropdown Button -->
                <button id="dropdownBtn" class="w-full flex justify-between items-center bg-white/10 backdrop-blur-md border border-white/20 rounded-xl px-5 py-4 shadow-[0_8px_32px_0_rgba(0,0,0,0.3)] focus:outline-none focus:ring-2 focus:ring-purple-400/50 hover:bg-white/20 transition-all duration-300 cursor-pointer">
                    <span id="btnText" class="text-gray-100 font-medium">Select an option</span>
                    <svg id="arrowIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-gray-300 transition-transform duration-300">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                    </svg>
                </button>

                <!-- Glassmorphism Options List (with entrance animation) -->
                <ul id="options" class="opacity-0 invisible -translate-y-2.5 transition-all duration-300 absolute w-full mt-3 bg-white/10 backdrop-blur-xl border border-white/20 rounded-xl shadow-[0_8px_32px_0_rgba(0,0,0,0.3)] overflow-hidden z-20">
                    <li class="px-5 py-3 text-gray-300 hover:bg-white/20 hover:text-white cursor-pointer transition-colors border-b border-white/10">
                        HTML
                    </li>
                    <li class="px-5 py-3 text-gray-300 hover:bg-white/20 hover:text-white cursor-pointer transition-colors border-b border-white/10">
                        CSS
                    </li>
                    <li class="px-5 py-3 text-gray-300 hover:bg-white/20 hover:text-white cursor-pointer transition-colors">
                        JavaScript
                    </li>
                </ul>
                
            </div>
            
        </section>
    </main>

    <script src="assets/js/app.js"></script>
</body>
</html>
